name: 'publish'

on:
  push:
    tags:
      - 'v*' # Trigger build and release when pushing tags matching v* (e.g., v1.0.0)

jobs:
  publish-tauri:
    permissions:
      contents: write # Needed to create GitHub releases and upload build assets
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: 'macos-latest'
            args: '--target aarch64-apple-darwin' # Apple Silicon (M1/M2/M3)
          - platform: 'macos-latest'
            args: '--target x86_64-apple-darwin'  # Intel Mac
          - platform: 'ubuntu-22.04'
            args: ''
          - platform: 'windows-latest'
            args: ''

    runs-on: ${{ matrix.platform }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: lts/*
          cache: 'npm'

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          # Build target for macOS cross-compilation
          targets: ${{ matrix.platform == 'macos-latest' && 'aarch64-apple-darwin,x86_64-apple-darwin' || '' }}

      - name: Rust Cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: './src-tauri -> target'

      - name: Install system dependencies (Ubuntu only)
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf xdg-utils

      - name: Install frontend dependencies
        run: npm ci

      - name: Build and Publish Tauri App
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          tagName: v__VERSION__
          releaseName: 'ReqTracker v__VERSION__'
          releaseBody: |
            ### 🚀 Novedades de ReqTracker v__VERSION__:

            #### 📱 Diseño Responsivo Integral
            - **Menú Lateral Adaptativo**: Modo *drawer* con botón hamburguesa y fondo desenfocado (*backdrop blur*) para resoluciones móviles y pantallas estrechas.
            - **Modo Compacto de Barra Lateral**: Soporte para colapsar la barra lateral a 72px (solo iconos) en escritorio y tablets para maximizar el área de trabajo.
            - **Patrón Maestro-Detalle**: En pantallas estrechas, navegación fluida entre la lista de proyectos y la vista de tareas con botón directo *"← Volver a Proyectos"*.
            - **Modales y Diálogos Fluidos**: Adaptación de `CommandPalette` y ventanas modales con márgenes de seguridad para evitar desbordes en cualquier resolución.

            #### 🖥️ Soporte Especializado para Pantallas Verticales (Portrait)
            - **Detección Automática de Orientación**: Colapso automático de la barra lateral al detectar pantallas en orientación vertical (como monitores rotados 1080x1920).
            - **Tablero Kanban con Snap Scrolling**: En orientación vertical, las columnas de tareas conservan un ancho legible (≥ 280px) con desplazamiento horizontal asistido (*snap scroll*) y scroll vertical independiente.
            - **Colapso del Panel de Proyectos**: Posibilidad de ocultar la lista de proyectos en pantallas de escritorio y verticales para otorgar el 100% del ancho al tablero Kanban.
            - **Dashboard Reorganizado**: Apilamiento vertical fluido de métricas, tareas pendientes críticas e ideas recientes.

            ---
            Descarga el instalador correspondiente a tu sistema operativo para instalar ReqTracker.

            ### 🍎 Nota para usuarios de macOS:
            Si macOS muestra el mensaje *"ReqTracker está dañado y no puede abrirse"*, ejecuta este comando en la Terminal tras mover la app a Aplicaciones:
            ```bash
            xattr -cr /Applications/ReqTracker.app
            ```
          releaseDraft: true
          prerelease: false
          args: ${{ matrix.args }}
