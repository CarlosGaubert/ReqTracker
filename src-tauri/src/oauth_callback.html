<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <title>ReqTracker Authentication</title>
  <style>
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      background-color: #0a0f1d;
      color: #f8fafc;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      height: 100vh;
      margin: 0;
    }
    .card {
      background-color: #131b2e;
      border: 1px solid #2e3b4e;
      padding: 2.5rem;
      border-radius: 16px;
      box-shadow: 0 20px 25px -5px rgba(0, 0, 0, 0.5);
      text-align: center;
      max-width: 420px;
      width: 90%;
    }
    h1 {
      font-size: 1.6rem;
      margin-top: 0;
      margin-bottom: 0.75rem;
      color: #38bdf8;
      font-weight: 700;
    }
    p {
      color: #94a3b8;
      line-height: 1.6;
      margin-bottom: 1.5rem;
      font-size: 0.95rem;
    }
    .spinner {
      border: 3px solid rgba(56, 189, 248, 0.1);
      width: 40px;
      height: 40px;
      border-radius: 50%;
      border-left-color: #38bdf8;
      animation: spin 1s linear infinite;
      margin: 0.5rem auto 1.5rem auto;
    }
    .success-icon {
      display: none;
      width: 48px;
      height: 48px;
      background-color: rgba(16, 185, 129, 0.1);
      border: 1px solid rgba(16, 185, 129, 0.2);
      color: #10b981;
      border-radius: 50%;
      line-height: 48px;
      font-size: 24px;
      margin: 0.5rem auto 1.5rem auto;
    }
    .error-icon {
      display: none;
      width: 48px;
      height: 48px;
      background-color: rgba(239, 68, 68, 0.1);
      border: 1px solid rgba(239, 68, 68, 0.2);
      color: #ef4444;
      border-radius: 50%;
      line-height: 48px;
      font-size: 24px;
      margin: 0.5rem auto 1.5rem auto;
    }
    @keyframes spin {
      0% { transform: rotate(0deg); }
      100% { transform: rotate(360deg); }
    }
    .btn-close {
      display: none;
      background-color: #38bdf8;
      color: #020617;
      border: none;
      padding: 0.6rem 1.5rem;
      font-size: 0.9rem;
      font-weight: 600;
      border-radius: 8px;
      cursor: pointer;
      margin-top: 1rem;
    }
    .btn-close:hover {
      background-color: #7dd3fc;
    }
  </style>
</head>
<body>
  <div class="card">
    <div class="spinner" id="spinner"></div>
    <div class="success-icon" id="success-icon">✓</div>
    <div class="error-icon" id="error-icon">✕</div>
    
    <h1 id="title">Conectando con la aplicación</h1>
    <p id="desc">Enviando la clave de acceso a ReqTracker. Por favor, no cierres esta ventana.</p>
    
    <button class="btn-close" id="btn-close" onclick="window.close()">Cerrar Ventana</button>
  </div>

  <script>
    const hash = window.location.hash;
    
    if (hash) {
      // Send the token back to the local Rust server
      fetch('/token', {
        method: 'POST',
        headers: {
          'Content-Type': 'application/json'
        },
        body: JSON.stringify({ hash: hash })
      })
      .then(response => {
        if (response.ok) {
          document.getElementById('spinner').style.display = 'none';
          document.getElementById('success-icon').style.display = 'block';
          document.getElementById('title').textContent = '¡Sesión Iniciada!';
          document.getElementById('title').style.color = '#10b981';
          document.getElementById('desc').textContent = 'Se han sincronizado tus credenciales con la aplicación de escritorio. Ya puedes volver a ReqTracker y cerrar esta pestaña.';
          document.getElementById('btn-close').style.display = 'inline-block';
        } else {
          throw new Error('El servidor local no aceptó las credenciales.');
        }
      })
      .catch(err => {
        document.getElementById('spinner').style.display = 'none';
        document.getElementById('error-icon').style.display = 'block';
        document.getElementById('title').textContent = 'Error de Sincronización';
        document.getElementById('title').style.color = '#ef4444';
        document.getElementById('desc').textContent = 'No pudimos conectar con ReqTracker en tu computadora. Asegúrate de tener la app abierta e inténtalo de nuevo. Detalle: ' + err.message;
      });
    } else {
      document.getElementById('spinner').style.display = 'none';
      document.getElementById('error-icon').style.display = 'block';
      document.getElementById('title').textContent = 'Enlace Inválido';
      document.getElementById('title').style.color = '#ef4444';
      document.getElementById('desc').textContent = 'No se encontró información de autenticación en la URL. Intenta iniciar sesión de nuevo desde la aplicación.';
    }
  </script>
</body>
</html>
